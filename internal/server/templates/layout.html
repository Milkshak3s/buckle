{{define "layout"}}<!doctype html>
<html lang="en"><head><meta charset="utf-8">
{{if .Refresh}}<meta http-equiv="refresh" content="{{.Refresh}}">{{end}}
<title>{{.Title}} · buckle</title>
<style>
body{font:14px/1.45 -apple-system,BlinkMacSystemFont,sans-serif;margin:0 auto;max-width:76rem;padding:1rem 1.5rem;color:#1d1d1f}
a{color:#0a58ca;text-decoration:none}a:hover{text-decoration:underline}
h1{font-size:1.4rem}h2{font-size:1.1rem;margin-top:2rem}
table{border-collapse:collapse;width:100%;margin:.5rem 0 1.5rem}
th,td{text-align:left;padding:.3rem .5rem;border-bottom:1px solid #e5e5e5;vertical-align:top}
th{font-weight:600;color:#555;white-space:nowrap}
code,pre{font:12px/1.4 ui-monospace,Menlo,monospace;word-break:break-all}
pre{background:#f6f6f6;padding:.75rem;white-space:pre-wrap}
.muted{color:#777}.note{color:#8a5a00}
.badge{font-size:11px;padding:0 .35rem;border-radius:3px;background:#e8f0fe;color:#1a4fa0;white-space:nowrap}
.badge.np{background:#fdecea;color:#a1260d}
tr.deny td{background:#fff8ec}
details summary{cursor:pointer}details pre{max-height:32rem;overflow:auto}
.args summary{color:#777;font-size:12px}.args pre{margin:.25rem 0 0}
tr.fork td{background:#f4f4f5;color:#8e8e93;font-size:12px;padding-top:.1rem;padding-bottom:.1rem}
tr.fork code{color:#8e8e93}tr.fork .badge{opacity:.6}tr.fork .args summary{font-size:11px}
tr.exec td{background:#e8f6ee}tr.exec td:first-child{box-shadow:inset 3px 0 #1f9d55}
tr.exec td:nth-child(3){color:#17693a;font-weight:600}
ul.tree,ul.tree ul{list-style:none;margin:0;padding:0}
ul.tree{margin:.5rem 0 1rem}
ul.tree ul{margin-left:.5rem;padding-left:.75rem;border-left:1px solid #ddd}
ul.tree li{margin:.25rem 0}ul.tree li.collapsed>ul{display:none}
.tree .twisty{display:inline-block;width:1rem;padding:0;border:0;background:none;color:#555;font:inherit;cursor:pointer}
.tree .twisty[hidden]{visibility:hidden}
.tree .off{color:#777}.tree .chain{font-weight:600}
.tree .node.fork,.tree .node.fork code{color:#8e8e93;font-size:12px}.tree .node.fork .chain{font-weight:normal}
.badge.fork{background:#f4f4f5;color:#8e8e93}
.tree .argline{display:block;margin-left:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tree .images{margin-left:1rem}.tree .images table{margin:.25rem 0 .5rem}
</style></head><body>
<header><a href="/"><strong>buckle</strong></a> <span class="muted">sandboxed session review</span></header>
{{template "content" .}}
</body></html>{{end}}
